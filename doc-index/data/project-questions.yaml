# Вопросы о проекте для дня 31: проверка ассистента разработчика.
#
# Отличие от контрольного набора дня 22: там спрашивали про предметную область
# (AI SDLC) по хранилищу Obsidian, здесь — про сам проект `ai-challenge`: как он
# устроен, чем собирается, что уже сделано. Ответы лежат в README, в `docs` и в
# отчётах по дням, поэтому набор проверяет и корпус, и то, что поиск находит нужный
# документ, а не «что-то похожее по теме».
#
# Поля те же, что в дне 24:
#   expect       — эталон для судьи (в прогонах без судьи не используется);
#   must_contain — проверяемые факты: список допустимых формулировок, факт покрыт,
#                  если в ответе есть любая из них;
#   answerable   — false: ответа в корпусе нет, правильное поведение «не знаю»;
#   must_not_contain — формулировки, которых в ответе быть не должно.
questions:
  - id: p01
    question: "Как собрать индекс документов в проекте?"
    sources: [doc-index/README.md]
    expect: >
      Командой `python -m doc_index index` из каталога `doc-index`: пайплайн читает корпус,
      режет его на чанки выбранной стратегией, считает эмбеддинги локальной моделью bge-m3
      через Ollama и складывает результат в SQLite + FTS5 + FAISS.
    must_contain:
      - ["doc_index index", "doc_index index --strategy"]
      - ["bge-m3", "bge m3"]
      - ["faiss"]
      - ["чанк", "chunk"]

  - id: p02
    question: "Чем стратегия чанкинга fixed отличается от structural?"
    sources: [doc-index/README.md, week5/day21.md]
    expect: >
      fixed режет по фиксированному окну символов с перекрытием (1000/150), ничего не зная
      о структуре заметки. structural режет по заголовкам, короткие секции приклеивает к
      соседним (окно 1200/200) и добавляет хлебные крошки — путь из заголовков.
    must_contain:
      - ["фиксированн", "окн"]
      - ["заголовк"]
      - ["перекрыти", "overlap", "150"]
      - ["крошк", "breadcrumb", "путь"]

  - id: p03
    question: "Какой командой в dsh-term переключается модель?"
    sources: [week6/day26.md]
    expect: >
      Командой `/model`: без аргумента открывается меню из облачных моделей DeepSeek и
      локальных моделей Ollama, с аргументом — выбирается конкретная модель по имени.
      Выбор сохраняется в состоянии и переживает перезапуск.
    must_contain:
      - ["/model"]
      - ["ollama", "локальн"]
      - ["deepseek", "облачн"]

  - id: p04
    question: "Что делает команда /rag-brief и чем она отличается от обычного вопроса агенту?"
    sources: [week6/day26.md, doc-index/README.md]
    expect: >
      /rag-brief считает справку мимо агента: тот же строгий путь, что в проверке дня 24,
      поэтому ответ приходит по шаблону ОТВЕТ + ИСТОЧНИКИ + ЦИТАТЫ, а источники и цитаты
      проверяются кодом, а не моделью. Обычный вопрос агенту идёт через инструменты.
    must_contain:
      - ["мимо агента", "без агент", "не через агент"]
      - ["источник"]
      - ["цитат"]
      - ["шаблон", "контракт", "формат"]

  - id: p05
    question: "Что проверяют в строгом режиме ответа с источниками и цитатами?"
    sources: [week5/day24.md]
    expect: >
      Что источники реально есть среди найденных фрагментов (не выдуманы), что цитаты
      дословны и приписаны нужному фрагменту, что формат ответа разобран, а на вопрос вне
      корпуса приходит отказ «не знаю» с просьбой уточнить.
    must_contain:
      - ["источник"]
      - ["цитат"]
      - ["дословн", "дословно"]
      - ["не знаю", "отказ"]

  - id: p06
    question: "Как устроен приватный сервис для локальной модели: что стоит перед моделью?"
    sources: [week6/day30.md, local-ai-service/README.md]
    expect: >
      Перед моделью стоит сервисный слой LiteLLM: он проверяет ключ, считает лимиты
      (запросы в минуту и параллелизм) и ведёт логи. Сама Ollama остаётся на 127.0.0.1 и
      снаружи недоступна, а чат Open WebUI ходит в сервис как обычный клиент.
    must_contain:
      - ["litellm"]
      - ["ключ"]
      - ["127.0.0.1", "петл", "локальн"]
      - ["open webui", "чат"]

  - id: p07
    question: "Что показало сравнение квантований Q4 и Q8 у локальной модели?"
    sources: [week6/day29.md]
    expect: >
      Что Q8_0 не дал выигрыша в качестве на задаче справки, но оказался медленнее
      (генерация примерно на треть, обработка промпта вдвое) и занял на 54% больше памяти.
      Поэтому выбран Q4_K_M.
    must_contain:
      - ["q8", "Q8"]
      - ["качеств"]
      - ["медленн", "медленнее", "скорост"]
      - ["памят", "54", "гигабайт", "ГБ"]

  - id: p08
    question: "Как подключить GitHub MCP к сессии dsh-term?"
    sources: [week4/day16.md]
    expect: >
      Флагом `--mcp github`: поднимается официальный remote-сервер GitHub в режиме readonly
      с наборами context, repos, issues и pull_requests, а токен берётся из `gh auth token`.
      Отдельно измерялась цена инструментов в промпте.
    must_contain:
      - ["--mcp github", "mcp github"]
      - ["readonly", "только чтение"]
      - ["токен", "gh auth"]

  - id: p09
    question: "Сколько вопросов в контрольном наборе дня 22 и что он измеряет?"
    sources: [week5/day22.md, doc-index/data/control-questions.yaml]
    expect: >
      Двенадцать отвечаемых вопросов и три вне корпуса; измеряется покрытие проверяемых
      фактов с RAG и без RAG, оценка судьи и попадание нужного источника в топ выдачи.
    must_contain:
      - ["12", "двенадцат"]
      - ["3", "три", "вне корпус"]
      - ["факт", "покрыти"]

  - id: p10
    question: "Как в проекте публикуется день: какие шаги делает скилл publish-day?"
    sources: [.dsh/SKILLS/publish-day.md]
    expect: >
      Скилл фиксирует изменения в ветке дня (например week6/day30), коммитит их с описанием,
      отправляет в origin и открывает pull request в недельную ветку feature/weekN.
    must_contain:
      - ["ветк"]
      - ["pull request", "PR"]
      - ["feature/", "недельн"]

  - id: p11
    question: "Какой сегодня курс доллара к рублю?"
    answerable: false
    expect: В корпусе проекта такого нет — правильный ответ «не знаю» с просьбой уточнить.
    must_not_contain:
      - ["рубль", "рубл"]

  - id: p12
    question: "Что такое квантовый отжиг и как его применяют?"
    answerable: false
    expect: Тема в документации проекта не описана — правильный ответ «не знаю».
    must_not_contain:
      - ["отжиг — это", "квантовый отжиг это"]
