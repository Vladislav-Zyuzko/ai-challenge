# Контрольный набор для дня 22: с RAG против без RAG.
#
# Для каждого вопроса зафиксировано:
#   expect       — что должно быть в правильном ответе (эталон для судьи);
#   sources      — заметки базы, откуда берётся ответ (если применимо);
#   must_contain — проверяемые факты: каждый факт — список допустимых формулировок,
#                  факт считается покрытым, если в ответе есть любая из них.
#
# Вопросы сформулированы живым языком, а не заголовками заметок: иначе проверялось бы
# совпадение строк, а не способность найти и пересказать знание.
#
# Большая часть корпуса — конспект внутреннего документа по аттестации (AI SDLC),
# поэтому «без RAG» здесь не просто отвечает хуже: нужных формулировок у модели
# в параметрах нет вовсе. Это и есть главный предмет сравнения.
questions:
  - id: c01
    question: "Что такое агентный харнесс и зачем он нужен агенту?"
    sources: [20_Понятия/11_Агентный_харнесс.md]
    expect: >
      Харнесс — программная инфраструктура вокруг модели, которая превращает её в работающего
      агента: организует цикл агента (думай → действуй → наблюдай), управляет контекстом
      и состоянием, опосредует вызовы инструментов, следит за разрешениями, обрабатывает сбои
      (повторы, чекпойнты, откат) и ведёт журнал действий для аудита. Модель лишь генерирует
      решения, а харнесс делает их надёжными и подотчётными; харнесс отличается от фреймворка
      и от среды выполнения.
    must_contain:
      - ["цикл агента", "цикл работы агента"]
      - ["контекст"]
      - ["разрешени", "права"]
      - ["журнал", "аудит", "подотчёт"]
      - ["фреймворк", "среда выполнения", "runtime"]

  - id: c02
    question: "Что такое MCP?"
    sources: [20_Понятия/16_Model_Context_Protocol.md]
    expect: >
      MCP — открытый стандарт интеграции AI-приложений с внешними инструментами и источниками
      данных, созданный в Anthropic и представленный в ноябре 2024 года. Архитектура
      host–client–server: хост создаёт отдельного клиента на каждый сервер; транспорты — stdio
      для локальных серверов и Streamable HTTP для удалённых.
    must_contain:
      - ["открыт", "стандарт", "протокол"]
      - ["хост", "host", "клиент"]
      - ["stdio"]
      - ["streamable http", "streamable", "http"]
      - ["anthropic", "антропик", "ноябр"]

  - id: c03
    question: "Что такое вызов инструмента и как он происходит?"
    sources: [20_Понятия/09_Вызов_инструмента.md]
    expect: >
      Модель вместо обычного текста возвращает структурированный запрос: имя инструмента
      и аргументы (как правило, по JSON-схеме). Среда выполнения исполняет вызов и возвращает
      модели результат, который становится входом следующего шага цикла. Это основное действие
      агента: через вызовы инструментов он читает файлы, запускает команды и обращается к сервисам.
    must_contain:
      - ["структурированн", "json", "схем"]
      - ["аргумент"]
      - ["результат", "tool result"]
      - ["среда выполнения", "среда", "приложение"]

  - id: c04
    question: "Что такое прогрессивное раскрытие контекста?"
    sources: [20_Понятия/24_Прогрессивное_раскрытие.md]
    expect: >
      Паттерн управления контекстом: сначала в контекст попадает минимально достаточный объём
      (метаданные, индексы, превью), а полное содержимое подгружается по требованию. Реализуется
      схемой «метаданные → превью → полный контент» и чтением нужных участков. Это альтернатива
      антипаттерну «загрузить весь проект в контекст».
    must_contain:
      - ["по требованию", "по мере необходимости", "подгружа"]
      - ["индекс", "метаданн", "превью"]
      - ["весь проект", "целиком"]

  - id: c05
    question: "Как считают долю изменений, принятых с первого предъявления?"
    sources: [20_Понятия/32_Доля_принятых_с_первого_предъявления.md]
    expect: >
      Это метрика качества процесса: доля изменений (PR/MR), принятых с первой попытки, то есть
      прошедших критерии приёмки без возврата на доработку или отклонения. Перенос классической
      метрики first-pass yield на разработку с ИИ-агентами, где единица наблюдения — изменение.
      Низкое значение говорит, что значительная часть работы требует доработок.
    must_contain:
      - ["перв", "предъявлен"]
      - ["без доработк", "без возврат", "отклонен", "доработ"]
      - ["first-pass", "first pass", "yield", "выработк"]

  - id: c06
    question: "Что такое контракт безопасного инструмента?"
    sources: [20_Понятия/54_Контракт_безопасного_инструмента.md]
    expect: >
      Формализованное описание безопасного применения инструмента: типизированная схема входных
      данных, семантика операции и её побочные эффекты, модель ошибок, разрешения, подтверждение
      человеком и аудит. Опирается на принцип минимальных привилегий и явное одобрение
      деструктивных операций.
    must_contain:
      - ["схем"]
      - ["семантик", "побочн"]
      - ["ошибк"]
      - ["минимальн", "привилег", "подтвержд", "аудит"]

  - id: c07
    question: "Зачем нужны блокирующие гейты в конвейере разработки?"
    sources: [20_Понятия/46_Блокирующие_гейты.md]
    expect: >
      Это точки контроля между стадиями: переход к следующей стадии запрещён, пока не выполнены
      заранее заданные критерии выхода. В отличие от неблокирующего предупреждения гейт
      останавливает поток работ до устранения причины. Перенос модели stage-gate; гейт одобрения —
      частный случай, где решение принимает человек.
    must_contain:
      - ["останавл", "запрещ", "блокир"]
      - ["критери"]
      - ["стади", "этап"]
      - ["stage-gate", "stage gate", "толлгейт", "tollgate"]

  - id: c08
    question: "Что такое канареечное развёртывание и когда его применяют?"
    sources: [20_Понятия/79_Канареечное_развёртывание.md]
    expect: >
      Стратегия поэтапного выпуска: новая версия сначала направляется малой доле трафика
      («канарейкам»), и если метрики здоровья в порядке, доля постепенно растёт до 100 %.
      При ухудшении метрик выпуск прерывается и следует откат. Противопоставляется одномоментному
      переключению и отличается от blue-green.
    must_contain:
      - ["мал", "дол", "трафик", "пользовател"]
      - ["метрик"]
      - ["откат", "прерыв", "останов"]
      - ["100"]

  - id: c09
    question: "Что такое промпт-инъекция и чем она опасна?"
    sources: [20_Понятия/61_Промпт_инъекция.md]
    expect: >
      Внедрение вредоносных или конфликтующих инструкций в данные, которые обрабатывает агент
      (файлы, комментарии, ответы API, веб-страницы). LLM архитектурно не различает инструкции
      и данные, поэтому атака возможна и косвенно — через недоверенный контент, включая RAG
      и вывод инструментов. Последствия: раскрытие чувствительных данных, небезопасные действия.
    must_contain:
      - ["данн"]
      - ["не различ", "один поток", "токен", "не отделяет"]
      - ["утечк", "раскрыт", "опасн"]
      - ["rag", "документ", "веб", "инструмент"]

  - id: c10
    question: "Что делать, если спецификация разошлась с кодом?"
    sources: [20_Понятия/20_Расхождение_спецификации_и_кода.md]
    expect: >
      Это spec-code drift: постепенное расхождение зафиксированного в спецификации замысла
      и фактического поведения кода. Возникает, когда меняются требования, а код не обновляется,
      или наоборот. Успешное прохождение тестов не доказывает соответствия спецификации: зелёный
      прогон показывает лишь согласованность кода с самим собой.
    must_contain:
      - ["спецификац"]
      - ["код"]
      - ["тест"]
      - ["меня", "обновл", "устарел", "расхожд"]

  - id: c11
    question: "Чем отличается чанкинг по фиксированному размеру от структурного?"
    sources:
      - ai-gladkov/30_Понятия_1/5_03_Чанкинг.md
      - ai-gladkov/20_Знания_1/5_03_Чанкинг_и_хранилище.md
    expect: >
      Чанкинг — разбиение документов на фрагменты, которые векторизуются и индексируются.
      Фиксированный размер режет по окнам (например, каждые 500 токенов), структурный —
      по смысловым блокам, заголовкам и разделам. У фиксированного смысловая единица может
      разорваться между чанками, поэтому применяют перекрытие (overlap); размер чанка
      и перекрытия подбирают экспериментально под модель и задачу.
    must_contain:
      - ["фиксирован"]
      - ["структурн", "семантическ", "заголовк"]
      - ["overlap", "перекрыти"]
      - ["токен", "символ"]

  - id: c12
    question: "Какие умения нужны роли TinyTeam?"
    sources: [10_ЗУН/02_Умения_TinyTeam.md]
    expect: >
      Перечень умений роли TinyTeam из матрицы ЗУН: спецификация функциональности на основе
      размытой задачи, проверяемые критерии приёмки, инварианты, условия эскалации, явные границы
      задачи и другие пункты перечня. Это внутренний документ аттестации, в общих знаниях модели
      такого перечня нет.
    must_contain:
      - ["критери"]
      - ["инвариант"]
      - ["эскалац"]
