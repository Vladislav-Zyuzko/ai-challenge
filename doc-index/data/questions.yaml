# Разметка ручная: по каждому вопросу указаны заметки, которые обязаны попасть в выдачу.
# Где ответ законно лежит в двух местах (например, RAG есть и в карточке понятия, и в
# конспекте кластера) — перечислены оба, попадание любой из них считается успехом.
#
# Вопросы сформулированы живым языком, а не заголовками заметок: иначе проверялось бы
# не качество поиска, а совпадение строк.
