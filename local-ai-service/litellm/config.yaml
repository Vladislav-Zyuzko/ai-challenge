# Сервис приватного доступа к локальным моделям (день 30).
#
# Схема: клиент → LiteLLM (ключи, rate limit, лимит контекста, логи) → Ollama.
# Ollama при этом остаётся на 127.0.0.1 и снаружи недоступен: наружу смотрит
# только сервисный слой, который проверяет ключ и считает запросы. Это главное
# архитектурное решение дня: модель приватна не потому, что «её никто не найдёт»,
# а потому что единственная точка входа умеет отказывать.

model_list:
  # Справка по базе знаний: контракт ответа зашит в модель (день 29).
  - model_name: rag-brief
    litellm_params:
      model: openai/rag-brief:8b
      api_base: http://127.0.0.1:11434/v1
      api_key: os.environ/OLLAMA_API_KEY
      temperature: 0
      max_tokens: 700
      # Режим рассуждений выключается здесь, на сервисе, а не в клиенте.
      # У qwen3 он включён по умолчанию, и если оставить как есть, то весь бюджет
      # ответа уходит в скрытое поле reasoning_content, а `content` приходит пустым:
      # в чате это выглядит как «модель молчит». `think: false` через
      # OpenAI-совместимый эндпоинт не действует (проверено в дне 26) —
      # работает только `reasoning_effort: none`.
      reasoning_effort: none
      # 6 запросов в минуту на эту модель. На CPU это не жадность, а защита:
      # генерация идёт ~7 токенов в секунду, и очередь из десяти запросов
      # означает, что все десять ждут минуты. Лучше получить 429 и повторить.
      rpm: 6
      # Один запрос в работе на модель — и это не произвол, а вывод из замера:
      # Ollama на CPU обслуживает запросы по очереди, поэтому при восьми
      # параллельных запросах задержка выросла ровно в восемь раз (p50 1.0 → 3.9 с),
      # а суммарная пропускная способность осталась 1 ответ в секунду. Очередь
      # ничего не ускоряет, зато клиент ждёт молча. Явный лимит превращает это
      # в честный и быстрый 429.
      max_parallel_requests: 1
    model_info:
      max_input_tokens: 8192
      max_output_tokens: 700

  # Обычная модель без контракта — для свободного чата.
  - model_name: qwen3-8b
    litellm_params:
      model: openai/qwen3:8b
      api_base: http://127.0.0.1:11434/v1
      api_key: os.environ/OLLAMA_API_KEY
      temperature: 0.6
      max_tokens: 700
      # Рассуждения выключены по той же причине: на CPU они стоят минуты и
      # съедают ответ целиком.
      reasoning_effort: none
      rpm: 6
      max_parallel_requests: 1
    model_info:
      max_input_tokens: 8192
      max_output_tokens: 700

litellm_settings:
  # Клиенты присылают поля, которых у локальной модели нет (например `options`
  # из примеров Ollama) — пусть они отбрасываются, а не роняют запрос.
  drop_params: true
  request_timeout: 900
  # Повторы выключены осознанно: на CPU повтор — это ещё минута ожидания,
  # а клиент всё равно получит 429/503 и решит сам.
  num_retries: 0

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
